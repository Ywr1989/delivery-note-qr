<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>送货单详情</title>
<!--
  丰康塑料厂 · 送货单扫码查看页
  版本：v2.00
  日期：2026-09-20
  基线：v1.00（edge-qr/index_20260920_改造前备份.html）
  改动：
    Q1 移除页面内的明文密钥（旧版第 41-42 行）
    Q2 改调 get_note → public_get_note（新码用 uid）/ legacy_get_note（旧码用单号）
    Q3 页脚"成都市武侯区丰康塑料厂"保持不变（客户认知主体就是丰康）
    Q5 源码中不残留任何凭证（本仓库为 public）
    Q6 BOM 组成展示保留；BOM 随单据一并返回，且只含该单涉及的料号
  部署：复制为 index.html 推送到 GitHub Pages
-->
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"Microsoft YaHei",sans-serif;padding:12px;max-width:600px;margin:0 auto;color:#333;line-height:1.7;font-size:14px}
h2{color:#1a56a8;font-size:18px;border-bottom:2px solid #1a56a8;padding-bottom:6px;margin-bottom:10px}
.card{background:#f8faff;border:1px solid #dbeafe;border-radius:8px;padding:12px;margin:10px 0}
.card .row{padding:3px 0;font-size:13px}
.card .row .lbl{color:#555;display:inline-block;min-width:60px}
.table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid #ccc;border-radius:4px;margin-top:10px}
.scroll-hint{background:#fffbe6;border:1px dashed #f0c36d;color:#8a6d00;border-radius:4px;padding:6px 10px;margin-top:6px;font-size:12px;text-align:center}
table{border-collapse:collapse;font-size:12px;min-width:100%;width:max-content}
th,td{border:1px solid #e5e7eb;padding:5px 6px;text-align:center;word-break:break-all}
th{background:#f0f4f8;color:#444;font-weight:bold;position:sticky;top:0;z-index:1;white-space:nowrap}
td{white-space:normal;max-width:280px}
td.l{text-align:left}
.loading{text-align:center;padding:60px 20px;color:#999}
.error{text-align:center;padding:40px 20px;color:#b71c1c}
.error small{display:block;margin-top:8px;color:#666;font-size:11px}
.footer{font-size:11px;color:#999;margin-top:14px;text-align:center;padding-top:10px;border-top:1px solid #eee}
.copy-btn{display:inline-block;margin:0;padding:5px 14px;background:#1a56a8;color:#fff;border:none;border-radius:4px;font-size:12px;cursor:pointer}
.copy-wrap{text-align:right;margin:20px 0 6px}
.copy-hint{font-size:12px;color:#1a56a8;margin-top:6px}
.copy-btn:active{background:#153e7a}
.copy-ok{background:#059669!important}

.bom-toggle{cursor:pointer;color:#1a56a8;font-size:11px;margin-left:4px;text-decoration:underline}
.bom-detail{display:none;margin:4px 0 2px;padding:6px 8px;background:#f0fdf4;border:1px solid #86efac;border-radius:4px;font-size:11px;line-height:1.5}
.bom-detail.show{display:block}
.bom-detail .bom-row{padding:1px 0}
.bom-detail .bom-row span{color:#555}
</style>
</head>
<body>
<div id="app"><div class="loading">加载中...</div></div>
<script>
/* v2.00：页面内不再保存任何密钥。云函数也不接受密钥，只认二维码里带的随机编号。 */
var API = "https://1253791604-411y9uhfks.ap-chengdu.tencentscf.com";
var p = new URLSearchParams(location.search);
var param = (p.get('s') || '').trim();

document.getElementById('app').innerHTML = '<div class="loading">加载中...</div>';

function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}

/* 判断二维码里带的是什么：
   - 老的纸质码：8位日期-3位序号，例如 20260807-060
   - 新的二维码：一串随机编号（32位） */
function buildRequest(v){
  if (/^\d{8}-\d{3}$/.test(v)) {
    return { action:'legacy_get_note', serial: v };   // 旧码
  }
  return { action:'public_get_note', uid: v };         // 新码
}

if (!param) {
  document.getElementById('app').innerHTML =
    '<div class="error">二维码内容为空<small>请重新扫描送货单上的二维码</small></div>';
} else {
  fetch(API, {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify(buildRequest(param))
  }).then(function(r){ return r.json() }).then(function(res){
    if (!res.ok) throw new Error(res.error || '加载失败');
    var note = res.note || {};
    var bom  = res.bom || {};
    var items = note.items || [];

    var bomParts = {};
    (items||[]).forEach(function(it){
      var pn = (it.part||'').trim();
      if (pn && bom[pn]) bomParts[pn] = bom[pn];
    });
    var hasBom = Object.keys(bomParts).length > 0;

    var header = '<div class="card">';
    header += '<div class="row"><span class="lbl">收货单位：</span>' + esc(note.company||'') + '</div>';
    if (note.contact || note.phone) header += '<div class="row"><span class="lbl">联系人：</span>' + esc((note.contact||'')+' '+(note.phone||'')) + '</div>';
    if (note.date) header += '<div class="row"><span class="lbl">日期：</span>' + esc(note.date) + '</div>';
    if (note.address) header += '<div class="row"><span class="lbl">地址：</span>' + esc(note.address) + '</div>';
    header += '</div>';

    var rows = '';
    for (var i = 0; i < items.length; i++) {
      var it = items[i];
      var pn = (it.part||'').trim();
      var bomHtml = '';
      if (pn && bomParts[pn]) {
        var comps = bomParts[pn];
        var bomId = 'bom-' + i;
        bomHtml = ' <span class="bom-toggle" onclick="document.getElementById(\''+bomId+'\').classList.toggle(\'show\')">组成</span><div class="bom-detail" id="'+bomId+'">';
        comps.forEach(function(c){
          bomHtml += '<div class="bom-row"><span>子件：</span>' + esc(c.part) + ' ×' + (c.qty||1) + '</div><div class="bom-row" style="color:#059669;padding-left:32px">' + esc(c.cn||'') + '</div>';
        });
        bomHtml += '</div>';
      }
      rows += '<tr><td>' + (i+1) + '</td>' +
        '<td class="l">' + esc(it.po||'') + '</td>' +
        '<td class="l">' + esc(it.part||'') + bomHtml + '</td>' +
        '<td class="l">' + esc(it.spec||'') + '</td>' +
        '<td>' + esc(it.unit||'') + '</td>' +
        '<td>' + esc(it.qty||'') + '</td>' +
        '<td>' + esc(it.carton||'') + '</td>' +
        '<td>' + esc(it.remark||'') + '</td></tr>';
    }

    var bomHint = hasBom ? '<div style="font-size:11px;color:#1a56a8;margin-top:4px;">点击品名品号后的「组成」查看装配料号</div>' : '';

    document.getElementById('app').innerHTML =
      '<h2>送货单 ' + esc(note.serial||param) + '</h2>' +
      header +
      (items.length ? '<div class="table-wrap"><table><thead><tr><th>#</th><th>客户订单号</th><th>品名品号</th><th>规格</th><th>单位</th><th>数量</th><th>箱数</th><th>备注</th></tr></thead><tbody>' + rows + '</tbody></table></div>' + bomHint + '<div class="scroll-hint">左右滑动查看完整表格（共 ' + items.length + ' 行）</div>' : '') +
      '<div class="copy-wrap"><button class="copy-btn" onclick="doCopy()">复制数据</button>' +
      '<div class="copy-hint">可粘贴到Excel，自动分列</div></div>' +
      '<div class="footer">成都市武侯区丰康塑料厂 | 扫码查看</div>';

    window._copyData = {
      serial: note.serial||param, date: note.date||'', company: note.company||'',
      contact: note.contact||'', phone: note.phone||'', address: note.address||'',
      items: items
    };
  }).catch(function(e){
    document.getElementById('app').innerHTML =
      '<div class="error">' + esc(e.message) +
      '<small>如反复失败，请联系发货方核对送货单</small></div>';
  });
}

function doCopy() {
  var d = window._copyData;
  if (!d) return;
  var lines = [];
  (d.items||[]).forEach(function(it){
    lines.push([it.po||'',it.part||'',it.spec||'',it.unit||'',it.qty||'',it.carton||'',it.remark||''].join('\t'));
  });
  var tsv = lines.join('\n');
  var btn = document.querySelector('.copy-btn');
  var done = function(){
    btn.textContent = '已复制'; btn.classList.add('copy-ok');
    setTimeout(function(){ btn.textContent = '复制数据'; btn.classList.remove('copy-ok'); }, 1500);
  };
  navigator.clipboard.writeText(tsv).then(done).catch(function(){
    var ta = document.createElement('textarea'); ta.value = tsv;
    ta.style.position='fixed';ta.style.left='-9999px';
    document.body.appendChild(ta); ta.select(); document.execCommand('copy');
    document.body.removeChild(ta);
    done();
  });
}
</script>
</body>
</html>
